# Конфигурация проекта Amvera для backend.
#
# Пушится сюда отдельным поддеревом, поэтому корнем репозитория становится
# папка backend/ — Dockerfile и этот файл оказываются на верхнем уровне:
#   git subtree push --prefix backend amvera-api master
#
# Постоянный диск /data переживает пересборки: в нём живут загруженные медиа
# и бэкапы, поэтому на Amvera локальные провайдеры годятся и для прода.

meta:
  environment: docker

build:
  dockerfile: Dockerfile

run:
  # Fastify слушает 3001 (BACKEND_PORT/PORT), наружу Amvera отдаёт по 80
  containerPort: 3001
  servicePort: 80
  persistenceMount: /data
