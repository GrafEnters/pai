# Конфигурация проекта Amvera для публичного сайта.
#
#   git subtree push --prefix web amvera-web master
#
# Постоянный диск не нужен: Next.js хранит ISR-кэш внутри контейнера,
# и потеря кэша при пересборке безвредна — страницы соберутся заново.

meta:
  environment: docker

build:
  dockerfile: Dockerfile

run:
  # next start в standalone-режиме слушает PORT, в образе он равен 3000
  containerPort: 3000
  servicePort: 80
