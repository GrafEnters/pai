# Единая точка входа комбинированного контейнера.
#
# Всё живёт на одном origin, и это не экономия, а упрощение: кука авторизации
# одна на сайт, админку и API, CORS не нужен вовсе, адрес API — относительный
# путь, поэтому его не надо вшивать в бандл при сборке.
#
#   /api/*     → backend  (кроме /api/revalidate — он принадлежит Next.js)
#   /media/*   → backend  (файлы с постоянного диска)
#   /health    → backend
#   /admin/*   → статика админки
#   /*         → Next.js

server {
    listen 80 default_server;
    server_name _;

    # Видео до 2 ГБ загружается напрямую по presigned-ссылке через этот же nginx
    client_max_body_size 2048M;
    # Большой файл не должен буферизоваться на диск целиком перед передачей
    proxy_request_buffering off;

    proxy_http_version 1.1;
    # Именно $http_host, а не $host: он сохраняет порт. Иначе Next.js строит
    # редиректы от своего внутреннего адреса и уводит на 127.0.0.1:3000
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Внешний адрес для редиректов Next.js: сам он его определить не может
    proxy_set_header X-Forwarded-Host $http_host;

    # Хук ревалидации — это роут самого Next.js, а не backend.
    # Точное совпадение в nginx приоритетнее префикса ниже.
    location = /api/revalidate {
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        # Долгая обработка видео и выгрузка XLSX не должны обрываться по таймауту
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:3001;
        # Перемотка видео идёт Range-запросами — буферизация их ломает
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        access_log off;
    }

    # Админка — обычная статика с SPA-фолбэком
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /app/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /admin/assets/ {
        alias /app/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
