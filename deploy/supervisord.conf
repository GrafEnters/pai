; Три процесса в одном контейнере: backend, Next.js и nginx перед ними.
; supervisor выбран ради перезапуска упавшего процесса и единого потока логов —
; в Amvera виден именно stdout контейнера.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:backend]
command=/app/run-backend.sh
directory=/app/backend
autorestart=true
startsecs=5
priority=10
; ВАЖНО: PORT задаём явно. Платформа кладёт в контейнер свой PORT (обычно 80),
; и без этой строки backend попытался бы занять порт nginx.
environment=PORT="3001",HOST="127.0.0.1",BACKEND_PORT="3001"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=node server.js
directory=/app/web
autorestart=true
startsecs=5
priority=20
environment=PORT="3000",HOSTNAME="127.0.0.1",NODE_ENV="production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
